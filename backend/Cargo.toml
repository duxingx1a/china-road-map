[package]
name = "map-server"
version = "1.0.4"
edition = "2024"
rust-version = "1.88"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "fs", "time", "macros"] }
tower-http = { version = "0.6.11", features = ["fs", "set-header"] }
rusqlite = { version = "0.40.2", features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
percent-encoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
