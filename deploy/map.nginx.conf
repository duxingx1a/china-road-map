location = /map {
    return 301 /map/;
}

location ^~ /map/ {
    # Burst allowances cover initial views and ten selected routes with LOD upgrades.
    limit_req zone=map_tiles burst=80 nodelay;
    limit_req zone=map_routes burst=40 nodelay;
    limit_req zone=map_network burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @map_rate_limited;
    # Docker DNS permits container replacement without stale upstream addresses.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $map_upstream china-road-map:8080;
    rewrite ^/map/(.*)$ /$1 break;
    proxy_pass http://$map_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

location @map_rate_limited {
    default_type application/json;
    add_header Retry-After 2 always;
    add_header Cache-Control no-store always;
    return 429 '{"error":"Too many map requests; retry shortly"}';
}
