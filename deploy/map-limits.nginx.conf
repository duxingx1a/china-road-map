# Loaded once in nginx's http context. Empty keys exempt unrelated applications.
map $uri $map_tile_client {
    default "";
    ~^/(map/)?tiles/ $binary_remote_addr;
}
map $uri $map_route_client {
    default "";
    ~^/(map/)?data/display/routes/ $binary_remote_addr;
}
map $uri $map_network_client {
    default "";
    ~^/(map/)?api/network$ $binary_remote_addr;
}
limit_req_zone $map_tile_client zone=map_tiles:1m rate=20r/s;
limit_req_zone $map_route_client zone=map_routes:1m rate=60r/m;
limit_req_zone $map_network_client zone=map_network:1m rate=2r/s;
